<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e293b">
    <title>Вход — Информатика СПО</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-screen">
    <div class="auth-box">
        <h2>🔐 Вход в систему</h2>
        <p class="subtitle">Интерактивная платформа по информатике</p>
        
        <select id="groupSelect" class="form-control">
            <option value="">Выберите группу</option>
            <option value="101">Группа 101</option>
            <option value="102">Группа 102</option>
            <option value="103">Группа 103</option>
            <option value="104">Группа 104</option>
            <option value="105">Группа 105</option>
            <option value="106">Группа 106</option>
            <option value="107">Группа 107</option>
            <option value="108">Группа 108</option>
        </select>
        
        <input type="text" id="fioInput" class="form-control" placeholder="Введите вашу фамилию" autocomplete="off" autofocus>
        
        <p class="error-msg" id="errorMsg"></p>
        <button class="btn btn-primary btn-block" onclick="doLogin()" style="padding:14px;font-size:1em;">Войти</button>
        
        <p class="text-muted text-center mt-2" style="font-size:0.75em;">
            📌 Введите фамилию так, как в журнале<br>
            👨‍🏫 <b>admin</b> / <b>admin2024</b> — вход для преподавателя
        </p>
    </div>

    <script src="js/google-sheets.js"></script>
    <script>
    // Администратор
    var ADMIN = { password: 'admin2024', name: 'Преподаватель', group: 'admin', isAdmin: true };

    // Хранилище результатов
    var resultsData = {};
    try {
        var saved = localStorage.getItem('itResults');
        if (saved) resultsData = JSON.parse(saved);
    } catch(e) {}

    function saveResults() {
        localStorage.setItem('itResults', JSON.stringify(resultsData));
    }

    // Функция входа
    function doLogin() {
        var groupSelect = document.getElementById('groupSelect');
        var fioInput = document.getElementById('fioInput');
        var errorMsg = document.getElementById('errorMsg');
        
        var group = groupSelect.value;
        var fio = fioInput.value.trim();
        
        errorMsg.style.display = 'none';
        
        // Проверка админа
        if (fio.toLowerCase() === 'admin') {
            var adminUser = { login: 'admin', name: ADMIN.name, group: 'admin', isAdmin: true };
            sessionStorage.setItem('currentUser', JSON.stringify(adminUser));
            window.location.href = 'admin.html';
            return;
        }
        
        if (!group) {
            errorMsg.textContent = 'Выберите группу';
            errorMsg.style.display = 'block';
            return;
        }
        
        if (!fio || fio.length < 2) {
            errorMsg.textContent = 'Введите фамилию';
            errorMsg.style.display = 'block';
            return;
        }
        
        // Показываем загрузку
        errorMsg.textContent = '⏳ Ищем вас в таблице группы ' + group + '...';
        errorMsg.style.color = '#2563eb';
        errorMsg.style.display = 'block';
        
        // Ищем студента в Google Таблице
        GoogleSheets.loadGroupData(group).then(function(students) {
            if (!students || students.length === 0) {
                errorMsg.textContent = '❌ Не удалось загрузить данные группы ' + group + '. Проверьте интернет.';
                errorMsg.style.color = '#dc2626';
                return;
            }
            
            // Ищем студента по фамилии
            var found = null;
            var searchFio = fio.toLowerCase();
            
            for (var i = 0; i < students.length; i++) {
                var studentFio = students[i].fio.toLowerCase();
                if (studentFio.includes(searchFio)) {
                    if (found) {
                        // Найдено несколько совпадений
                        errorMsg.textContent = '⚠️ Найдено несколько студентов с такой фамилией. Введите имя и фамилию.';
                        errorMsg.style.color = '#d97706';
                        return;
                    }
                    found = students[i];
                }
            }
            
            if (!found) {
                errorMsg.textContent = '❌ Студент с фамилией "' + fio + '" не найден в группе ' + group;
                errorMsg.style.color = '#dc2626';
                return;
            }
            
            // Успешный вход
            var userKey = group + '_' + found.fio.replace(/\s+/g, '_');
            
            var currentUser = {
                login: userKey,
                name: found.fio,
                group: group,
                sheetData: found
            };
            
            if (!resultsData[userKey]) {
                resultsData[userKey] = { tasks: {}, lastLogin: new Date().toISOString() };
            } else {
                resultsData[userKey].lastLogin = new Date().toISOString();
            }
            saveResults();
            
            sessionStorage.setItem('currentUser', JSON.stringify(currentUser));
            window.location.href = 'dashboard.html';
            
        }).catch(function(error) {
            console.error('Ошибка:', error);
            errorMsg.textContent = '❌ Ошибка загрузки данных. Попробуйте позже.';
            errorMsg.style.color = '#dc2626';
        });
    }

    // Вход по Enter
    document.getElementById('fioInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') doLogin();
    });
    </script>
</body>
</html>
