<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мои оценки — Информатика СПО</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .task-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-top:8px}
        .task-card{border:2px solid #e2e8f0;border-radius:8px;padding:8px;text-align:center;background:white}
        .task-card h4{font-size:.7em;margin-bottom:2px;color:#64748b}
        .task-card .grade{font-size:1.3em;font-weight:700;margin:2px 0}
        .grade-5{color:#059669}.grade-4{color:#2563eb}.grade-3{color:#d97706}.grade-2{color:#dc2626}.grade-empty{color:#94a3b8}
        .status-badge{display:inline-block;padding:2px 6px;border-radius:8px;font-size:.65em;font-weight:600}
        .badge-done{background:#ecfdf5;color:#065f46}
        .badge-fail{background:#fef2f2;color:#991b1b}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
        .stat-card{background:linear-gradient(135deg,#f8fafc,#fff);border:1px solid #e2e8f0;border-radius:10px;padding:12px;text-align:center}
        .stat-card .val{font-size:1.8em;font-weight:700}
        .stat-card .lbl{font-size:.7em;color:#64748b;margin-top:2px}
        .c-green{color:#059669}.c-red{color:#dc2626}.c-blue{color:#2563eb}.c-yellow{color:#d97706}
        .section-title{margin:14px 0 6px;font-weight:700;font-size:.85em;color:#1e293b;border-bottom:2px solid #e2e8f0;padding-bottom:4px}
        .progress-bar{background:#e2e8f0;border-radius:4px;height:6px;margin-top:4px;overflow:hidden}
        .progress-fill{height:6px;border-radius:4px}
        .fill-green{background:#059669}.fill-red{background:#dc2626}.fill-yellow{background:#d97706}
    </style>
</head>
<body>
    <header class="header">
        <h1>📚 Информатика — СПО 1 курс</h1>
        <div class="user-block">
            <span id="userName"></span>
            <button class="btn btn-outline btn-sm" onclick="doLogout()">🚪 Выйти</button>
        </div>
    </header>

    <div class="container">
        <main class="main-content" id="mainContent" style="width:100%;">
            <div style="text-align:center;padding:40px;">🔄 Загрузка...</div>
        </main>
    </div>

    <script src="js/auth.js"></script>
    <script>
        var user = checkAuth();
        if (!user) window.location.href = 'index.html';
        document.getElementById('userName').textContent = user.name + ' (гр. ' + user.group + ')';

        var SHEET_IDS = {
            '101':'1e4fcZ6J6fHfsvb6xca8lP5AwSRT2t7b02GcHEZfTmwU',
            '102':'1AeNAFAkY1EDD4NfVUmk04j2nqZK3l2ltdXuDNX6bB-Q',
            '103':'1LSe4uS98lWDNyjigS028Kn4lV42u7N2DUjyJo3y3RHc',
            '104':'1Z8uVSazOeBtclHgIBsYEBFCD_RikTjPzQyjyAZF2t3Y',
            '105':'1Zga2Kn2BjzL1RCidFiNDbDtQF7IbLZzdZ8AE7AXM9fw',
            '106':'1fNXJCnmJ_szR50v2RfPKx_xR2gHDL44hr7SxHI1oLgo',
            '107':'1m-D6b57CdSPDEw6vcevvVMB4twmJReLa8xS4qyMFJ2Y',
            '108':'1qwWCSk-EDVq1amZ3Hn8fKsJULBkthr8lr9_x68vjlsY'
        };

        loadData();

        function loadData() {
            document.getElementById('mainContent').innerHTML = '<div style="text-align:center;padding:40px;">🔄 Загрузка...</div>';
            
            var sheetId = SHEET_IDS[user.group] || SHEET_IDS['102'];
            
            Promise.all([
                fetch('https://docs.google.com/spreadsheets/d/' + sheetId + '/gviz/tq?tqx=out:json&sheet=ПЗ').then(function(r){return r.text();}),
                fetch('https://docs.google.com/spreadsheets/d/' + sheetId + '/gviz/tq?tqx=out:json&sheet=ЛР').then(function(r){return r.text();}),
                fetch('https://docs.google.com/spreadsheets/d/' + sheetId + '/gviz/tq?tqx=out:json&sheet=Допуск').then(function(r){return r.text();})
            ]).then(function(results) {
                var pz = parseSheet(results[0], 'ПЗ');
                var lr = parseSheet(results[1], 'ЛР');
                
                var search = user.name.toLowerCase().replace(/\s+/g, ' ').trim();
                var pzRow = findRow(pz, search);
                var lrRow = findRow(lr, search);
                
                if (!pzRow && !lrRow) {
                    showError('Студент не найден');
                    return;
                }
                
                // Данные допуска
                var dopText = '';
                try {
                    var dopJson = JSON.parse(results[2].substring(results[2].indexOf('{'), results[2].lastIndexOf('}') + 1));
                    var dopRows = dopJson.table.rows;
                    var dopRow = null;
                    for (var i = 2; i < dopRows.length; i++) {
                        var dc = dopRows[i].c;
                        if (dc && dc[1]) {
                            var dopFio = String(dc[1].v || '').trim();
                            if (dopFio.toLowerCase().includes(search)) {
                                dopRow = { cells: dc };
                                break;
                            }
                        }
                    }
                    renderPage({ pz: pzRow, lr: lrRow, dop: dopRow });
                } catch(e) {
                    renderPage({ pz: pzRow, lr: lrRow, dop: null });
                }
            }).catch(function(e) {
                console.error(e);
                showError('Ошибка загрузки');
            });
        }

        function parseSheet(text) {
            var json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
            var rows = json.table.rows;
            var students = [];
            
            // Сохраняем заголовки из 2-й строки (индекс 1)
            var headers = [];
            if (rows[1] && rows[1].c) {
                for (var i = 0; i < rows[1].c.length; i++) {
                    headers[i] = rows[1].c[i] ? (rows[1].c[i].v || rows[1].c[i].f || '') : '';
                }
            }
            
            for (var i = 2; i < rows.length; i++) {
                var cells = rows[i].c;
                if (!cells) continue;
                var fio = cells[3] ? String(cells[3].v || '').trim() : '';
                if (!fio) continue;
                students.push({ fio: fio, cells: cells, _headers: headers });
            }
            return students;
        }

        function findRow(students, search) {
            for (var i = 0; i < students.length; i++) {
                var name = students[i].fio.toLowerCase().replace(/\s+/g, ' ').trim();
                if (name === search || name.includes(search) || search.includes(name)) {
                    return students[i];
                }
            }
            return null;
        }

        function getVal(cell) {
            if (!cell) return '';
            var v = cell.v;
            if (v === null || v === undefined) v = cell.f || '';
            return String(v).trim();
        }

        function extractTasks(row, type) {
            var tasks = {};
            if (!row || !row.cells) return tasks;
            
            var cells = row.cells;
            
            // Заголовки из 2-й строки (индекс 1 в JSON)
            var headers = row._headers || [];
            
            // Проходим по всем ячейкам, начиная с колонки E (индекс 4)
            for (var i = 4; i < cells.length - 3; i++) {
                var headerCell = headers[i];
                if (!headerCell) continue;
                
                var headerText = String(headerCell).trim();
                
                // Ищем номера ПЗ/ЛР в заголовке
                // Форматы: "1\n23.09", "2\n26.09", "5\n1.11", "19\n11" и т.д.
                var match = headerText.match(/^(\d+)/);
                if (!match) continue;
                
                var number = match[1];
                var taskId = (type === 'ПЗ' ? 'ПЗ ' : 'ЛР ') + number;
                
                // Проверяем, что это действительно номер работы, а не что-то другое
                // Пропускаем "Вх кон", "тест с.с." и т.д.
                if (headerText.includes('Вх') || headerText.includes('тест') || headerText.includes('П/р') || headerText.includes('Excel')) continue;
                
                // Берём значение из текущей ячейки (статус) и следующей (оценка)
                var statusVal = getVal(cells[i]);
                var gradeVal = getVal(cells[i + 1]);
                
                // Проверяем, что следующая ячейка — это оценка, а не новый заголовок
                var nextHeader = headers[i + 1];
                if (nextHeader && String(nextHeader).trim().match(/^\d+/)) {
                    // Следующая ячейка — начало новой работы, значит у этой только статус
                    tasks[taskId] = { status: statusVal, grade: '' };
                } else {
                    tasks[taskId] = { status: statusVal, grade: gradeVal };
                    i++; // Пропускаем ячейку с оценкой
                }
            }
            
            return tasks;
        }

        function renderPage(data) {
            var pzTasks = extractTasks(data.pz, 'ПЗ');
            var lrTasks = extractTasks(data.lr, 'ЛР');
            var pzAll = Object.values(pzTasks);
            var lrAll = Object.values(lrTasks);
            var allTasks = pzAll.concat(lrAll);
            
            var done = allTasks.filter(function(t){ return t.grade && !isNaN(parseFloat(t.grade)) && parseFloat(t.grade) > 0 && t.status !== '2'; }).length;
            var debts = allTasks.filter(function(t){ return t.status === '2' || t.status === 'н' || !t.grade || t.grade === '' || t.grade === '0'; }).length;
            var total = allTasks.length;
            
            var pzGrades = []; pzAll.forEach(function(t){ if(t.grade && !isNaN(parseFloat(t.grade)) && parseFloat(t.grade)>0 && t.status!=='2') pzGrades.push(parseFloat(t.grade)); });
            var lrGrades = []; lrAll.forEach(function(t){ if(t.grade && !isNaN(parseFloat(t.grade)) && parseFloat(t.grade)>0 && t.status!=='2') lrGrades.push(parseFloat(t.grade)); });
            var allGrades = pzGrades.concat(lrGrades);
            
            var avgPZ = pzGrades.length ? Math.round((pzGrades.reduce(function(a,b){return a+b},0)/pzGrades.length)*10)/10 : 0;
            var avgLR = lrGrades.length ? Math.round((lrGrades.reduce(function(a,b){return a+b},0)/lrGrades.length)*10)/10 : 0;
            var avgAll = allGrades.length ? Math.round((allGrades.reduce(function(a,b){return a+b},0)/allGrades.length)*10)/10 : 0;

            // Данные из листа Допуск
            var dopuskText = '—';
            var dopuskColor = '#94a3b8';
            var dopuskBg = '#f1f5f9';
            var avtomatText = '—';
            var avtomatColor = '#94a3b8';
            var avtomatBg = '#f1f5f9';
            
            if (data.dop && data.dop.cells) {
                var dc = data.dop.cells;
                var rawDopusk = getVal(dc[2]);
                var rawAvtomat = getVal(dc[3]);
                
                if (rawDopusk === 'ДОП') {
                    dopuskText = 'ДОПУЩЕН';
                    dopuskColor = '#059669';
                    dopuskBg = '#ecfdf5';
                } else if (rawDopusk === 'НЕДОП') {
                    dopuskText = 'НЕ ДОПУЩЕН';
                    dopuskColor = '#dc2626';
                    dopuskBg = '#fef2f2';
                }
                
                if (rawAvtomat === 'да') {
                    avtomatText = 'АВТОМАТ';
                    avtomatColor = '#059669';
                    avtomatBg = '#ecfdf5';
                } else if (rawAvtomat === 'нет') {
                    avtomatText = 'НЕТ АВТОМАТА';
                    avtomatColor = '#dc2626';
                    avtomatBg = '#fef2f2';
                }
            }

            var h = '<h2>📊 Мои оценки</h2>';
            
            // Строка с ФИО, группой и плашками
            h += '<div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px;">';
            h += '<span class="text-muted" style="font-size:0.95em;">' + user.name + ' | Группа ' + user.group + '</span>';
            h += '<span style="padding:4px 12px;border-radius:6px;font-size:0.8em;font-weight:700;background:' + dopuskBg + ';color:' + dopuskColor + ';">' + dopuskText + '</span>';
            h += '<span style="padding:4px 12px;border-radius:6px;font-size:0.8em;font-weight:700;background:' + avtomatBg + ';color:' + avtomatColor + ';">' + avtomatText + '</span>';
            h += '</div>';

            // Статистика
            h += '<div class="stats-grid">';
            h += '<div class="stat-card"><div class="val c-green">' + done + '/' + total + '</div><div class="lbl">✅ Сдано работ</div></div>';
            h += '<div class="stat-card"><div class="val c-red">' + debts + '</div><div class="lbl">❌ Долгов</div></div>';
            h += '<div class="stat-card"><div class="val c-blue">' + (avgAll||'—') + '</div><div class="lbl">📊 Средний балл</div></div>';
            h += '<div class="stat-card"><div class="val c-yellow">' + (avgPZ||'—') + ' / ' + (avgLR||'—') + '</div><div class="lbl">📝 ПЗ / 🔬 ЛР</div></div>';
            h += '</div>';

            // Прогресс-бар
            var pct = total ? Math.round(done/total*100) : 0;
            var fc = pct>=80?'fill-green':pct>=50?'fill-yellow':'fill-red';
            h += '<div style="margin:8px 0;font-size:.8em;">Прогресс: <b>' + pct + '%</b> (' + done + ' из ' + total + ' сдано, ' + debts + ' долгов)</div>';
            h += '<div class="progress-bar"><div class="progress-fill ' + fc + '" style="width:' + pct + '%"></div></div>';

            // ПЗ
            h += '<div class="section-title">📝 Практические занятия (ср. балл: ' + (avgPZ||'—') + ')</div><div class="task-grid">';
            ['ПЗ 1','ПЗ 2','ПЗ 3','ПЗ 5','ПЗ 6','ПЗ 7','ПЗ 8','ПЗ 9','ПЗ 10','ПЗ 11','ПЗ 12','ПЗ 13','ПЗ 14','ПЗ 15','ПЗ 16','ПЗ 17','ПЗ 18','ПЗ 19','ПЗ 20','ПЗ 21','ПЗ 24','ПЗ 25','ПЗ 27','ПЗ 28','ПЗ 29'].forEach(function(id){ if(pzTasks[id]!==undefined) h+=renderCard(id,pzTasks[id]); });
            h += '</div>';

            // ЛР
            h += '<div class="section-title">🔬 Лабораторные работы (ср. балл: ' + (avgLR||'—') + ')</div><div class="task-grid">';
            ['ЛР 1','ЛР 2','ЛР 3','ЛР 4','ЛР 5','ЛР 6','ЛР 7','ЛР 8','ЛР 9','ЛР 10','ЛР 11','ЛР 12','ЛР 13','ЛР 14','ЛР 15','ЛР 16'].forEach(function(id){ if(lrTasks[id]!==undefined) h+=renderCard(id,lrTasks[id]); });
            h += '</div>';

            h += '<button class="btn btn-secondary btn-sm mt-2" onclick="loadData()">🔄 Обновить</button>';
            document.getElementById('mainContent').innerHTML = h;
        }

        function renderCard(id, task) {
            var status = task ? (task.status || '') : '';
            var grade = task ? (task.grade || '') : '';
            var hasGrade = grade && !isNaN(parseFloat(grade)) && parseFloat(grade) > 0;
            
            var display = 'долг';
            var cls = 'grade-2';
            var badge = '<span class="status-badge badge-fail">✘</span>';
            
            // Пересдача: 2 в статусе + оценка => среднее арифметическое с округлением вверх
            if (status === '2' && hasGrade) {
                var avg = (2 + parseFloat(grade)) / 2;
                avg = Math.ceil(avg * 2) / 2; // округляем до 0.5 вверх
                if (avg === 2) avg = 2;
                if (avg === 2.5) avg = 3;
                if (avg === 3) avg = 3;
                if (avg === 3.5) avg = 4;
                if (avg === 4) avg = 4;
                if (avg === 4.5) avg = 5;
                display = avg;
                if (avg >= 5) cls = 'grade-5';
                else if (avg >= 4) cls = 'grade-4';
                else if (avg >= 3) cls = 'grade-3';
                else cls = 'grade-2';
                badge = '<span class="status-badge badge-done">✔</span>';
            }
            // Обычная сдача: есть оценка, нет "2"
            else if (hasGrade && status !== '2' && status !== 'н') {
                display = grade;
                var g = parseFloat(grade);
                if (g >= 5) cls = 'grade-5';
                else if (g >= 4) cls = 'grade-4';
                else if (g >= 3) cls = 'grade-3';
                else cls = 'grade-2';
                badge = '<span class="status-badge badge-done">✔</span>';
            }
            // "н" + оценка = сдал после пропуска
            else if (status === 'н' && hasGrade) {
                display = grade;
                var g = parseFloat(grade);
                if (g >= 5) cls = 'grade-5';
                else if (g >= 4) cls = 'grade-4';
                else if (g >= 3) cls = 'grade-3';
                else cls = 'grade-2';
                badge = '<span class="status-badge badge-done">✔</span>';
            }
            
            return '<div class="task-card"><h4>' + id + '</h4><div class="grade ' + cls + '">' + display + '</div>' + badge + '</div>';
        }

        function showError(msg) {
            document.getElementById('mainContent').innerHTML = '<h2>Мои оценки</h2><p class="text-muted">' + user.name + ' | Группа ' + user.group + '</p><div style="text-align:center;padding:40px;color:#dc2626;"><p>' + msg + '</p><button class="btn btn-primary mt-2" onclick="loadData()">Попробовать снова</button></div>';
        }

        function doLogout() {
            sessionStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
