<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отладка — Информатика СПО</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header"><h1>📚 Отладка парсера</h1><div class="user-block"><span id="userName"></span><button class="btn btn-outline btn-sm" onclick="doLogout()">🚪 Выйти</button></div></header>
    <div class="container"><main class="main-content" id="mainContent" style="width:100%;"><div style="text-align:center;padding:40px;">🔄 Загрузка...</div></main></div>

    <script src="js/auth.js"></script>
    <script>
        var user = checkAuth();
        if (!user) window.location.href = 'index.html';
        document.getElementById('userName').textContent = user.name + ' (гр. ' + user.group + ')';

        var SHEET_IDS = {
            '102':'1AeNAFAkY1EDD4NfVUmk04j2nqZK3l2ltdXuDNX6bB-Q'
        };

        function getV(c){if(!c)return'';var v=c.v;if(v===null||v===undefined)v=c.f||'';return String(v).trim();}

        function loadData(){
            var d=document.getElementById('mainContent');
            d.innerHTML='<div style="text-align:center;padding:40px;">🔄 Загрузка...</div>';
            var sid=SHEET_IDS['102'];
            var search='вахрушев';
            
            Promise.all([
                fetch('https://docs.google.com/spreadsheets/d/'+sid+'/gviz/tq?tqx=out:json&sheet=ПЗ').then(function(r){return r.text();}),
                fetch('https://docs.google.com/spreadsheets/d/'+sid+'/gviz/tq?tqx=out:json&sheet=ЛР').then(function(r){return r.text();})
            ]).then(function(results){
                var pzJson=JSON.parse(results[0].substring(results[0].indexOf('{'),results[0].lastIndexOf('}')+1));
                var lrJson=JSON.parse(results[1].substring(results[1].indexOf('{'),results[1].lastIndexOf('}')+1));
                
                var h='<h2>Отладка ПЗ</h2>';
                
                // Показываем заголовки (строка 2, индекс 1)
                h+='<h3>Заголовки ПЗ (строка 2):</h3><div style="overflow-x:auto;"><table><tr><th>Индекс</th><th>Значение</th></tr>';
                var pzHeaders=pzJson.table.rows[1].c;
                for(var i=0;i<Math.min(pzHeaders.length,60);i++){
                    h+='<tr><td>'+i+'</td><td>'+getV(pzHeaders[i])+'</td></tr>';
                }
                h+='</table></div>';
                
                // Ищем студента
                h+='<h3>Поиск студента:</h3>';
                for(var i=2;i<pzJson.table.rows.length;i++){
                    var c=pzJson.table.rows[i].c;
                    if(c&&c[3]){
                        var f=getV(c[3]).toLowerCase();
                        if(f.includes('вахрушев')){
                            h+='<p>✅ Найден: строка '+i+', ФИО: '+getV(c[3])+'</p>';
                            h+='<h3>Данные студента (первые 30 ячеек):</h3><div style="overflow-x:auto;"><table><tr><th>Индекс</th><th>Значение</th></tr>';
                            for(var j=0;j<30;j++){
                                h+='<tr><td>'+j+'</td><td>'+getV(c[j])+'</td></tr>';
                            }
                            h+='</table></div>';
                            break;
                        }
                    }
                }
                
                h+='<h2>Отладка ЛР</h2>';
                h+='<h3>Заголовки ЛР (строка 2):</h3><div style="overflow-x:auto;"><table><tr><th>Индекс</th><th>Значение</th></tr>';
                var lrHeaders=lrJson.table.rows[1].c;
                for(var i=0;i<Math.min(lrHeaders.length,40);i++){
                    h+='<tr><td>'+i+'</td><td>'+getV(lrHeaders[i])+'</td></tr>';
                }
                h+='</table></div>';
                
                d.innerHTML=h;
            }).catch(function(e){d.innerHTML='<p style="color:#dc2626;">Ошибка: '+e.message+'</p>';});
        }

        function doLogout(){sessionStorage.removeItem('currentUser');window.location.href='index.html';}
        loadData();
    </script>
</body>
</html>
