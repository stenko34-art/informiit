<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мои оценки — Информатика СПО</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .task-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:16px}
        .task-card{border:2px solid #e2e8f0;border-radius:12px;padding:14px;text-align:center;background:white;transition:.2s}
        .task-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.1)}
        .task-card h4{font-size:.8em;margin-bottom:6px;color:#64748b}
        .task-card .grade{font-size:2em;font-weight:700;margin:6px 0}
        .grade-5{color:#059669}.grade-4{color:#2563eb}.grade-3{color:#d97706}.grade-2{color:#dc2626}.grade-empty{color:#94a3b8}
        .status-badge{display:inline-block;padding:3px 8px;border-radius:10px;font-size:.7em;font-weight:600}
        .badge-done{background:#ecfdf5;color:#065f46}
        .badge-fail{background:#fef2f2;color:#991b1b}
        .badge-pending{background:#f1f5f9;color:#475569}
        .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
        .summary-card{background:#f8fafc;border-radius:10px;padding:14px;text-align:center}
        .summary-card .num{font-size:2em;font-weight:700}
        .summary-card .lbl{font-size:.75em;color:#64748b}
        .num-green{color:#059669}.num-red{color:#dc2626}.num-blue{color:#2563eb}
    </style>
</head>
<body>
    <header class="header">
        <h1>📚 Информатика — СПО 1 курс</h1>
        <div class="user-block">
            <span id="userName"></span>
            <button class="btn btn-outline btn-sm" onclick="doLogout()">🚪 Выйти</button>
        </div>
    </header>

    <div class="container">
        <main class="main-content" id="mainContent" style="width:100%;">
            <div style="text-align:center;padding:40px;">🔄 Загрузка...</div>
        </main>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/google-sheets.js"></script>
    <script>
        var user = checkAuth();
        if (!user) window.location.href = 'index.html';
        
        document.getElementById('userName').textContent = user.name + ' (гр. ' + user.group + ')';
        
        loadData();
        
        function loadData() {
            document.getElementById('mainContent').innerHTML = 
                '<div style="text-align:center;padding:40px;">🔄 Загрузка данных из Google Таблиц...</div>';
            
            GoogleSheets.getStudentSheetData(user.name, user.group).then(function(student) {
                if (student) {
                    renderPage(student);
                } else {
                    document.getElementById('mainContent').innerHTML = 
                        '<h2>📊 Мои оценки</h2>' +
                        '<p class="text-muted">' + user.name + ' | Группа ' + user.group + '</p>' +
                        '<div style="text-align:center;padding:40px;color:#dc2626;">' +
                        '<p>❌ Данные не найдены</p>' +
                        '<button class="btn btn-primary mt-2" onclick="loadData()">🔄 Обновить</button>' +
                        '</div>';
                }
            }).catch(function(err) {
                console.error(err);
                document.getElementById('mainContent').innerHTML = 
                    '<h2>📊 Мои оценки</h2>' +
                    '<p class="text-muted">' + user.name + ' | Группа ' + user.group + '</p>' +
                    '<div style="text-align:center;padding:40px;color:#dc2626;">' +
                    '<p>❌ Ошибка загрузки</p>' +
                    '<button class="btn btn-primary mt-2" onclick="loadData()">🔄 Обновить</button>' +
                    '</div>';
            });
        }
        
        function renderPage(student) {
            var h = '<h2>📊 Мои оценки</h2>';
            h += '<p class="text-muted">' + user.name + ' | Группа ' + user.group + '</p>';
            
            // Показываем ФИО из таблицы
            h += '<p style="font-size:.8em;color:#94a3b8;">✅ Данные загружены из Google Таблицы</p>';
            
            // Отладка: показываем сырые данные
            h += '<details style="margin:12px 0;font-size:.8em;">';
            h += '<summary>📋 Отладка: данные из таблицы</summary>';
            h += '<pre style="background:#f8fafc;padding:10px;border-radius:6px;overflow-x:auto;font-size:.75em;">';
            h += 'ФИО: ' + student.fio + '\n';
            h += 'Заданий: ' + Object.keys(student.tasks).length + '\n\n';
            for (var tid in student.tasks) {
                var t = student.tasks[tid];
                h += tid + ': статус="' + t.status + '", оценка="' + t.grade + '"\n';
            }
            h += '</pre></details>';
            
            h += '<button class="btn btn-secondary btn-sm mt-1" onclick="loadData()">🔄 Обновить</button>';
            
            document.getElementById('mainContent').innerHTML = h;
        }
        
        function doLogout() {
            sessionStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
