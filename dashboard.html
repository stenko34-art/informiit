<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мои оценки — Информатика СПО</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .task-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-top:8px}
        .task-card{border:2px solid #e2e8f0;border-radius:8px;padding:8px;text-align:center;background:white}
        .task-card h4{font-size:.7em;margin-bottom:2px;color:#64748b}
        .task-card .grade{font-size:1.3em;font-weight:700;margin:2px 0}
        .grade-5{color:#059669}.grade-4{color:#2563eb}.grade-3{color:#d97706}.grade-2{color:#dc2626}.grade-empty{color:#94a3b8}
        .status-badge{display:inline-block;padding:2px 6px;border-radius:8px;font-size:.65em;font-weight:600}
        .badge-done{background:#ecfdf5;color:#065f46}
        .badge-fail{background:#fef2f2;color:#991b1b}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
        .stat-card{background:linear-gradient(135deg,#f8fafc,#fff);border:1px solid #e2e8f0;border-radius:10px;padding:12px;text-align:center}
        .stat-card .val{font-size:1.8em;font-weight:700}
        .stat-card .lbl{font-size:.7em;color:#64748b;margin-top:2px}
        .c-green{color:#059669}.c-red{color:#dc2626}.c-blue{color:#2563eb}.c-yellow{color:#d97706}
        .section-title{margin:14px 0 6px;font-weight:700;font-size:.85em;color:#1e293b;border-bottom:2px solid #e2e8f0;padding-bottom:4px}
        .progress-bar{background:#e2e8f0;border-radius:4px;height:6px;margin-top:4px;overflow:hidden}
        .progress-fill{height:6px;border-radius:4px}
        .fill-green{background:#059669}.fill-red{background:#dc2626}.fill-yellow{background:#d97706}
    </style>
</head>
<body>
    <header class="header">
        <h1>📚 Информатика — СПО 1 курс</h1>
        <div class="user-block">
            <span id="userName"></span>
            <button class="btn btn-outline btn-sm" onclick="doLogout()">🚪 Выйти</button>
        </div>
    </header>

    <div class="container">
        <main class="main-content" id="mainContent" style="width:100%;">
            <div style="text-align:center;padding:40px;">🔄 Загрузка...</div>
        </main>
    </div>

    <script src="js/auth.js"></script>
    <script>
        var user = checkAuth();
        if (!user) window.location.href = 'index.html';
        document.getElementById('userName').textContent = user.name + ' (гр. ' + user.group + ')';

        var SHEET_IDS = {
            '101':'1e4fcZ6J6fHfsvb6xca8lP5AwSRT2t7b02GcHEZfTmwU',
            '102':'1AeNAFAkY1EDD4NfVUmk04j2nqZK3l2ltdXuDNX6bB-Q',
            '103':'1LSe4uS98lWDNyjigS028Kn4lV42u7N2DUjyJo3y3RHc',
            '104':'1Z8uVSazOeBtclHgIBsYEBFCD_RikTjPzQyjyAZF2t3Y',
            '105':'1Zga2Kn2BjzL1RCidFiNDbDtQF7IbLZzdZ8AE7AXM9fw',
            '106':'1fNXJCnmJ_szR50v2RfPKx_xR2gHDL44hr7SxHI1oLgo',
            '107':'1m-D6b57CdSPDEw6vcevvVMB4twmJReLa8xS4qyMFJ2Y',
            '108':'1qwWCSk-EDVq1amZ3Hn8fKsJULBkthr8lr9_x68vjlsY'
        };

        loadData();

        function loadData() {
            var d = document.getElementById('mainContent');
            d.innerHTML = '<div style="text-align:center;padding:40px;">🔄 Загрузка...</div>';
            
            var sheetId = SHEET_IDS[user.group] || SHEET_IDS['102'];
            var search = user.name.toLowerCase().replace(/\s+/g, ' ').trim();
            
            // Загружаем оба листа
            Promise.all([
                fetch('https://docs.google.com/spreadsheets/d/' + sheetId + '/gviz/tq?tqx=out:json&sheet=ПЗ').then(function(r){return r.text();}),
                fetch('https://docs.google.com/spreadsheets/d/' + sheetId + '/gviz/tq?tqx=out:json&sheet=ЛР').then(function(r){return r.text();}),
                fetch('https://docs.google.com/spreadsheets/d/' + sheetId + '/gviz/tq?tqx=out:json&sheet=Допуск').then(function(r){return r.text();})
            ]).then(function(results) {
                var pzData = parseAll(results[0], search, 'ПЗ');
                var lrData = parseAll(results[1], search, 'ЛР');
                var dopData = parseDop(results[2], search);
                
                if (!pzData.student && !lrData.student) {
                    d.innerHTML = '<h2>📊 Мои оценки</h2><p class="text-muted">' + user.name + ' | Группа ' + user.group + '</p><p style="color:#dc2626;text-align:center;padding:20px;">Студент не найден</p>';
                    return;
                }
                
                renderPage({
                    pzTasks: pzData.tasks,
                    lrTasks: lrData.tasks,
                    pzHeaders: pzData.headers,
                    lrHeaders: lrData.headers,
                    dop: dopData
                });
            }).catch(function(e) {
                console.error(e);
                d.innerHTML = '<h2>📊 Мои оценки</h2><p style="color:#dc2626;">Ошибка загрузки</p>';
            });
        }

        function parseAll(text, search, type) {
            var json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
            var rows = json.table.rows;
            
            // Заголовки из строки 2 (индекс 1)
            var headers = [];
            if (rows[1] && rows[1].c) {
                for (var i = 0; i < rows[1].c.length; i++) {
                    headers[i] = rows[1].c[i] ? String(rows[1].c[i].v || rows[1].c[i].f || '') : '';
                }
            }
            
            // Ищем студента
            var studentCells = null;
            for (var i = 2; i < rows.length; i++) {
                var cells = rows[i].c;
                if (!cells || !cells[3]) continue;
                var fio = String(cells[3].v || '').trim().toLowerCase().replace(/\s+/g, ' ');
                if (fio === search || fio.includes(search) || search.includes(fio)) {
                    studentCells = cells;
                    break;
                }
            }
            
            // Парсим задания: идём по заголовкам, находим номера
            var tasks = {};
            if (studentCells) {
                var prevNum = 0;
                for (var i = 4; i < headers.length - 3; i++) {
                    var hdr = headers[i].trim();
                    var match = hdr.match(/^(\d+)/);
                    if (!match) continue;
                    if (hdr.includes('Вх') || hdr.includes('тест') || hdr.includes('П/р') || hdr.includes('Excel') || hdr.includes('сред') || hdr.includes('проп') || hdr.includes('Осталось') || hdr.includes('Ссылка') || hdr.includes('Номер') || hdr.includes('Автом') || hdr.includes('Допуск')) continue;
                    
                    var num = parseInt(match[1]);
                    if (num === prevNum) continue; // сдвоенный столбец
                    prevNum = num;
                    
                    var taskId = (type === 'ПЗ' ? 'ПЗ ' : 'ЛР ') + num;
                    
                    // Проверяем следующую ячейку
                    var nextHdr = (i + 1 < headers.length) ? headers[i + 1].trim() : '';
                    var nextMatch = nextHdr.match(/^(\d+)/);
                    
                    if (nextMatch && !nextHdr.includes('Excel')) {
                        // Только оценка
                        tasks[taskId] = { status: '', grade: getV(studentCells[i]) };
                    } else {
                        // Статус + оценка
                        tasks[taskId] = { status: getV(studentCells[i]), grade: getV(studentCells[i + 1]) };
                    }
                }
            }
            
            return { student: studentCells, tasks: tasks, headers: headers };
        }

        function parseDop(text, search) {
            try {
                var json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
                var rows = json.table.rows;
                for (var i = 2; i < rows.length; i++) {
                    var cells = rows[i].c;
                    if (!cells || !cells[1]) continue;
                    var fio = String(cells[1].v || '').trim().toLowerCase().replace(/\s+/g, ' ');
                    if (fio === search || fio.includes(search) || search.includes(fio)) {
                        return {
                            dopusk: getV(cells[2]),
                            avtomat: getV(cells[3])
                        };
                    }
                }
            } catch(e) {}
            return null;
        }

        function getV(cell) {
            if (!cell) return '';
            var v = cell.v;
            if (v === null || v === undefined) v = cell.f || '';
            return String(v).trim();
        }

        function renderPage(data) {
            var pz = data.pzTasks;
            var lr = data.lrTasks;
            var all = {};
            for (var k in pz) all[k] = pz[k];
            for (var k in lr) all[k] = lr[k];
            
            var pzArr = Object.values(pz);
            var lrArr = Object.values(lr);
            var allArr = Object.values(all);
            
            var done = allArr.filter(function(t){return t.grade&&!isNaN(parseFloat(t.grade))&&parseFloat(t.grade)>0&&t.status!=='2';}).length;
            var debts = allArr.filter(function(t){return t.status==='2'||t.status==='н'||!t.grade||t.grade===''||t.grade==='0';}).length;
            var total = allArr.length;
            
            var getAvg = function(arr){var g=arr.filter(function(t){return t.grade&&!isNaN(parseFloat(t.grade))&&parseFloat(t.grade)>0&&t.status!=='2';}).map(function(t){return parseFloat(t.grade);});return g.length?Math.round(g.reduce(function(a,b){return a+b},0)/g.length*10)/10:0;};
            var avgPZ = getAvg(pzArr), avgLR = getAvg(lrArr), avgAll = getAvg(allArr);
            
            var dopText = '', dopColor = '#94a3b8', dopBg = '#f1f5f9';
            var avtText = '', avtColor = '#94a3b8', avtBg = '#f1f5f9';
            
            if (data.dop) {
                if (data.dop.dopusk === 'ДОП') { dopText = 'ДОПУЩЕН'; dopColor = '#059669'; dopBg = '#ecfdf5'; }
                else if (data.dop.dopusk === 'НЕДОП') { dopText = 'НЕ ДОПУЩЕН'; dopColor = '#dc2626'; dopBg = '#fef2f2'; }
                if (data.dop.avtomat === 'да') { avtText = 'АВТОМАТ'; avtColor = '#059669'; avtBg = '#ecfdf5'; }
                else if (data.dop.avtomat === 'нет') { avtText = 'НЕТ АВТОМАТА'; avtColor = '#dc2626'; avtBg = '#fef2f2'; }
            }

            var h = '<h2>📊 Мои оценки</h2>';
            h += '<div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px;">';
            h += '<span class="text-muted">' + user.name + ' | Группа ' + user.group + '</span>';
            if (dopText) h += '<span style="padding:4px 12px;border-radius:6px;font-size:.8em;font-weight:700;background:'+dopBg+';color:'+dopColor+';">'+dopText+'</span>';
            if (avtText) h += '<span style="padding:4px 12px;border-radius:6px;font-size:.8em;font-weight:700;background:'+avtBg+';color:'+avtColor+';">'+avtText+'</span>';
            h += '</div>';

            h += '<div class="stats-grid">';
            h += '<div class="stat-card"><div class="val c-green">'+done+'/'+total+'</div><div class="lbl">✅ Сдано работ</div></div>';
            h += '<div class="stat-card"><div class="val c-red">'+debts+'</div><div class="lbl">❌ Долгов</div></div>';
            h += '<div class="stat-card"><div class="val c-blue">'+(avgAll||'—')+'</div><div class="lbl">📊 Средний балл</div></div>';
            h += '<div class="stat-card"><div class="val c-yellow">'+(avgPZ||'—')+' / '+(avgLR||'—')+'</div><div class="lbl">📝 ПЗ / 🔬 ЛР</div></div>';
            h += '</div>';

            var pct = total ? Math.round(done/total*100) : 0;
            var fc = pct>=80?'fill-green':pct>=50?'fill-yellow':'fill-red';
            h += '<div style="margin:8px 0;font-size:.8em;">Прогресс: <b>'+pct+'%</b></div>';
            h += '<div class="progress-bar"><div class="progress-fill '+fc+'" style="width:'+pct+'%"></div></div>';

            // Сортируем ПЗ по номеру
            var pzKeys = Object.keys(pz).sort(function(a,b){return parseInt(a.replace('ПЗ ','')) - parseInt(b.replace('ПЗ ',''));});
            var lrKeys = Object.keys(lr).sort(function(a,b){return parseInt(a.replace('ЛР ','')) - parseInt(b.replace('ЛР ',''));});

            h += '<div class="section-title">📝 Практические занятия (ср. балл: '+(avgPZ||'—')+')</div><div class="task-grid">';
            pzKeys.forEach(function(id){ h += card(id, pz[id]); });
            h += '</div>';

            h += '<div class="section-title">🔬 Лабораторные работы (ср. балл: '+(avgLR||'—')+')</div><div class="task-grid">';
            lrKeys.forEach(function(id){ h += card(id, lr[id]); });
            h += '</div>';

            h += '<button class="btn btn-secondary btn-sm mt-2" onclick="loadData()">🔄 Обновить</button>';
            document.getElementById('mainContent').innerHTML = h;
        }

        function card(id, t) {
            var s = t ? (t.status||'') : '';
            var g = t ? (t.grade||'') : '';
            var has = g && !isNaN(parseFloat(g)) && parseFloat(g) > 0;
            var isDone = has && s !== '2';
            var disp = isDone ? g : 'долг';
            var cls = isDone ? ('grade-' + (parseFloat(g)>=5?'5':parseFloat(g)>=4?'4':parseFloat(g)>=3?'3':'2')) : 'grade-2';
            var badge = isDone ? '<span class="status-badge badge-done">✔</span>' : '<span class="status-badge badge-fail">✘</span>';
            
            // Пересдача: 2 + оценка
            if (s === '2' && has) {
                var avg = Math.ceil((2 + parseFloat(g)) / 2);
                disp = avg;
                cls = 'grade-' + (avg>=5?'5':avg>=4?'4':avg>=3?'3':'2');
                badge = '<span class="status-badge badge-done">✔</span>';
            }
            // н + оценка = сдал после пропуска
            if (s === 'н' && has) {
                disp = g;
                cls = 'grade-' + (parseFloat(g)>=5?'5':parseFloat(g)>=4?'4':parseFloat(g)>=3?'3':'2');
                badge = '<span class="status-badge badge-done">✔</span>';
            }
            
            return '<div class="task-card"><h4>'+id+'</h4><div class="grade '+cls+'">'+disp+'</div>'+badge+'</div>';
        }

        function showError(msg) {
            document.getElementById('mainContent').innerHTML = '<h2>📊 Мои оценки</h2><p style="color:#dc2626;">'+msg+'</p>';
        }

        function doLogout() {
            sessionStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
