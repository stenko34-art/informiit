<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мои оценки — Информатика СПО</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .task-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-top:8px}
        .task-card{border:2px solid #e2e8f0;border-radius:8px;padding:8px;text-align:center;background:white}
        .task-card h4{font-size:.7em;margin-bottom:2px;color:#64748b}
        .task-card .grade{font-size:1.3em;font-weight:700;margin:2px 0}
        .grade-5{color:#059669}.grade-4{color:#2563eb}.grade-3{color:#d97706}.grade-2{color:#dc2626}.grade-empty{color:#94a3b8}
        .status-badge{display:inline-block;padding:2px 6px;border-radius:8px;font-size:.65em;font-weight:600}
        .badge-done{background:#ecfdf5;color:#065f46}
        .badge-fail{background:#fef2f2;color:#991b1b}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
        .stat-card{background:linear-gradient(135deg,#f8fafc,#fff);border:1px solid #e2e8f0;border-radius:10px;padding:12px;text-align:center}
        .stat-card .val{font-size:1.8em;font-weight:700}
        .stat-card .lbl{font-size:.7em;color:#64748b;margin-top:2px}
        .c-green{color:#059669}.c-red{color:#dc2626}.c-blue{color:#2563eb}.c-yellow{color:#d97706}
        .section-title{margin:14px 0 6px;font-weight:700;font-size:.85em;color:#1e293b;border-bottom:2px solid #e2e8f0;padding-bottom:4px}
        .progress-bar{background:#e2e8f0;border-radius:4px;height:6px;margin-top:4px;overflow:hidden}
        .progress-fill{height:6px;border-radius:4px}
        .fill-green{background:#059669}.fill-red{background:#dc2626}.fill-yellow{background:#d97706}
    </style>
</head>
<body>
    <header class="header">
        <h1>📚 Информатика — СПО 1 курс</h1>
        <div class="user-block">
            <span id="userName"></span>
            <button class="btn btn-outline btn-sm" onclick="doLogout()">🚪 Выйти</button>
        </div>
    </header>

    <div class="container">
        <main class="main-content" id="mainContent" style="width:100%;">
            <div style="text-align:center;padding:40px;">🔄 Загрузка...</div>
        </main>
    </div>

    <script src="js/auth.js"></script>
    <script>
        var user = checkAuth();
        if (!user) window.location.href = 'index.html';
        document.getElementById('userName').textContent = user.name + ' (гр. ' + user.group + ')';

        var SHEET_IDS = {
            '101':'1e4fcZ6J6fHfsvb6xca8lP5AwSRT2t7b02GcHEZfTmwU',
            '102':'1AeNAFAkY1EDD4NfVUmk04j2nqZK3l2ltdXuDNX6bB-Q',
            '103':'1LSe4uS98lWDNyjigS028Kn4lV42u7N2DUjyJo3y3RHc',
            '104':'1Z8uVSazOeBtclHgIBsYEBFCD_RikTjPzQyjyAZF2t3Y',
            '105':'1Zga2Kn2BjzL1RCidFiNDbDtQF7IbLZzdZ8AE7AXM9fw',
            '106':'1fNXJCnmJ_szR50v2RfPKx_xR2gHDL44hr7SxHI1oLgo',
            '107':'1m-D6b57CdSPDEw6vcevvVMB4twmJReLa8xS4qyMFJ2Y',
            '108':'1qwWCSk-EDVq1amZ3Hn8fKsJULBkthr8lr9_x68vjlsY'
        };

        loadData();

        function loadData(forceRefresh) {
            var cacheKey = 'cache_' + user.group;
            var cached = sessionStorage.getItem(cacheKey);
            
            if (cached && !forceRefresh) {
                var data = JSON.parse(cached);
                renderPage(data);
                return;
            }
            
            document.getElementById('mainContent').innerHTML = '<div style="text-align:center;padding:40px;">🔄 Загрузка данных из Google Таблиц...</div>';
                    
            var sheetId = SHEET_IDS[user.group] || SHEET_IDS['102'];
            
            Promise.all([
                fetch('https://docs.google.com/spreadsheets/d/' + sheetId + '/gviz/tq?tqx=out:json&sheet=ПЗ').then(function(r){return r.text();}),
                fetch('https://script.google.com/macros/s/AKfycbxYSBWV0DTfqlKEvi_gQjjUNxUfCNs7CF5zgZoKSKqpS8LLCSdUxWDwMENaQduf9gEv/exec?id=' + sheetId + '&sheet=ЛР').then(function(r){return r.text();}),
                fetch('https://docs.google.com/spreadsheets/d/' + sheetId + '/gviz/tq?tqx=out:json&sheet=Допуск').then(function(r){return r.text();})
            ]).then(function(results) {
                var pz = parseSheet(results[0], 'ПЗ');
                var lr = parseSheet(results[1], 'ЛР');
                var dop = parseSheet(results[2], 'Допуск');
                
                var search = user.name.toLowerCase().replace(/\s+/g, ' ').trim();
                var pzRow = findRow(pz, search);
                var lrRow = findRow(lr, search);
                var dopRow = findRow(dop, search);
                
                if (!pzRow && !lrRow) {
                    showError('Студент не найден в таблице группы ' + user.group);
                    return;
                }
                
                var pageData = { pz: pzRow, lr: lrRow, dop: dopRow, pzSheet: pz, lrSheet: lr };
                sessionStorage.setItem(cacheKey, JSON.stringify(pageData));
                renderPage(pageData);
            }).catch(function(e) {
                console.error(e);
                showError('Ошибка загрузки данных');
            });
        }

        function parseSheetLR(text) {
            var data = JSON.parse(text);
            var students = [];

            var taskCols = [
                { col: 4,  name: '1' },
                { col: 6,  name: '2' },
                { col: 8,  name: '3' },
                { col: 10, name: '4' },
                { col: 12, name: '5' },
                { col: 14, name: '6' },
                { col: 16, name: '7' }
            ];

            // Динамические ЛР 8+ из строки 1
            var headerRow = data[1] || [];
            for (var c = 0; c < headerRow.length; c++) {
                var val = String(headerRow[c] || '').trim().split('\n')[0].trim();
                if (/^\d+$/.test(val) && parseInt(val) >= 8) {
                    taskCols.push({ col: c, name: val });
                }
            }

            taskCols.sort(function(a, b) {
                return parseInt(a.name) - parseInt(b.name);
            });

            for (var i = 2; i < data.length; i++) {
                var row = data[i];
                var fio = row[3] ? String(row[3]).trim() : '';
                if (!fio) continue;
                // Конвертируем в формат {v, f}
                var cells = row.map(function(v) {
                    return { v: v, f: String(v) };
                });
                students.push({ fio: fio, cells: cells });
            }

            students._taskCols = taskCols;
            return students;
        }

        function parseSheet(text, sheetType) {
            if (sheetType === 'ЛР') {
                return parseSheetLR(text);
            }
            var json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
            var rows = json.table.rows;
            var students = [];

            var headerRow = rows[0] ? rows[0].c : [];
            var taskCols = [];

            if (sheetType === 'ПЗ') {
                taskCols.push({ col: 4, name: 'Вх.кон', single: true });
                taskCols.push({ col: 6, name: '1' });
                taskCols.push({ col: 8, name: '2' });
                taskCols.push({ col: 10, name: '3' });
                taskCols.push({ col: 36, name: 'Excel', single: true });
            }

            if (sheetType === 'ЛР') {
                taskCols.push({ col: 4,  name: '1' });
                taskCols.push({ col: 6,  name: '2' });
                taskCols.push({ col: 8,  name: '3' });
                taskCols.push({ col: 10, name: '4' });
                taskCols.push({ col: 12, name: '5' });
                taskCols.push({ col: 14, name: '6' });
                taskCols.push({ col: 16, name: '7' });
                taskCols.push({ col: 18, name: '8' });
                taskCols.push({ col: 20, name: '9' });
                taskCols.push({ col: 22, name: '10' });
                taskCols.push({ col: 24, name: '11' });
                taskCols.push({ col: 26, name: '12' });
                taskCols.push({ col: 28, name: '13' });
                taskCols.push({ col: 30, name: '14' });
                taskCols.push({ col: 32, name: '15' });
                taskCols.push({ col: 34, name: '16' });
            }

            for (var c = 0; c < headerRow.length; c++) {
                var cell = headerRow[c];
                var raw = cell ? (cell.v !== null && cell.v !== undefined ? cell.v : (cell.f || '')) : '';
                var val = String(raw).trim().split('\n')[0].trim();
                if (/^\d+$/.test(val)) {
                    taskCols.push({ col: c, name: val });
                }
            }

            var startRow = sheetType === 'ЛР' ? 1 : 1;
            for (var i = startRow; i < rows.length; i++) {
                var cells = rows[i].c;
                if (!cells) continue;
                var fio = cells[3] ? String(cells[3].v || '').trim() : '';
                if (!fio) continue;
                students.push({ fio: fio, cells: cells });
            }

            taskCols.sort(function(a, b) {
                var an = parseInt(a.name);
                var bn = parseInt(b.name);
                if (isNaN(an) && isNaN(bn)) return 0;
                if (isNaN(an)) return -1; // нечисловые (Вх.кон, Excel) — в начало
                if (isNaN(bn)) return 1;
                return an - bn;
            });
            students._taskCols = taskCols;
            return students;
        }

        function findRow(students, search) {
            for (var i = 0; i < students.length; i++) {
                var name = students[i].fio.toLowerCase().replace(/\s+/g, ' ').trim();
                if (name === search || name.includes(search) || search.includes(name)) {
                    return students[i];
                }
            }
            return null;
        }

        function getVal(cell) {
            if (!cell) return '';
            var v = cell.v;
            if (v === null || v === undefined) v = cell.f || '';
            return String(v).trim();
        }

        function extractTasks(row, sheetData, prefix) {
            var tasks = {};
            if (!row || !sheetData._taskCols) return tasks;
            var cells = row.cells;
            sheetData._taskCols.forEach(function(tc) {
            if (tc.single) {
                // Одна колонка — сама является оценкой
                tasks[tc.name] = {
                    status: '',
                    grade: getVal(cells[tc.col])
                };
            } else {
                tasks[prefix + ' ' + tc.name] = {
                    status: getVal(cells[tc.col]),
                    grade:  getVal(cells[tc.col + 1])
                };
            }
        });
            return tasks;
        }

        function renderPage(data) {
            var pzTasks = extractTasks(data.pz, data.pzSheet, 'ПЗ');
            var lrTasks = extractTasks(data.lr, data.lrSheet, 'ЛР');
            var pzAll = Object.values(pzTasks);
            var lrAll = Object.values(lrTasks);

            // Только работы которые реально есть в таблице
            var pzKeys = Object.keys(pzTasks);
            var lrKeys = Object.keys(lrTasks);
            var allTasks = pzAll.concat(lrAll);
            
            var done = allTasks.filter(function(t){ return t.grade && !isNaN(parseFloat(t.grade)) && parseFloat(t.grade) > 0 && t.status !== '2'; }).length;
            var debts = allTasks.filter(function(t){
                var g = String(t.grade || '').toLowerCase();
                var s = String(t.status || '').toLowerCase();
                // Если есть любая пометка пропуска — это не долг
                if (g === 'н' || g === 'н/б' || s === 'н' || s === 'н/б') return false;
                // Долг — это если стоит '2' или ячейка пустая
                return s === '2' || !g || g === '' || g === '0';
            }).length;

            var absents = allTasks.filter(function(t){
                var g = String(t.grade || '').toLowerCase();
                var s = String(t.status || '').toLowerCase();
                return g === 'н' || g === 'н/б' || s === 'н' || s === 'н/б';
            }).length;
            var total = allTasks.length;
            
            var pzGrades = []; pzAll.forEach(function(t){ if(t.grade && !isNaN(parseFloat(t.grade)) && parseFloat(t.grade)>0 && t.status!=='2') pzGrades.push(parseFloat(t.grade)); });
            var lrGrades = []; lrAll.forEach(function(t){ if(t.grade && !isNaN(parseFloat(t.grade)) && parseFloat(t.grade)>0 && t.status!=='2') lrGrades.push(parseFloat(t.grade)); });
            var allGrades = pzGrades.concat(lrGrades);
            
            var avgPZ = pzGrades.length ? Math.round((pzGrades.reduce(function(a,b){return a+b},0)/pzGrades.length)*10)/10 : 0;
            var avgLR = lrGrades.length ? Math.round((lrGrades.reduce(function(a,b){return a+b},0)/lrGrades.length)*10)/10 : 0;
            var avgAll = allGrades.length ? Math.round((allGrades.reduce(function(a,b){return a+b},0)/allGrades.length)*10)/10 : 0;

            var dopText = '';
            if (data.dop && data.dop.cells) {
                var dc = data.dop.cells;
                var dopusk = getVal(dc[2]) || '—';
                var avtomat = getVal(dc[3]) || '—';
                dopText = dopusk + ' | Автомат: ' + avtomat;
            }

            var h = '<h2>Мои оценки</h2>';
            h += '<p class="text-muted">' + user.name + ' | Группа ' + user.group + '</p>';
            h += '<div class="stats-grid">';
            h += '<div class="stat-card"><div class="val c-green">' + done + '/' + total + '</div><div class="lbl">Сдано работ</div></div>';
            h += '<div class="stat-card"><div class="val c-red">' + debts + '</div><div class="lbl">Долгов</div></div>';
            h += '<div class="stat-card"><div class="val c-yellow">' + absents + '</div><div class="lbl">Пропусков</div></div>';
            h += '<div class="stat-card"><div class="val c-blue">' + (avgAll||'—') + '</div><div class="lbl">Средний балл</div></div>';
            h += '<div class="stat-card"><div class="val c-yellow">' + (avgPZ||'—') + ' / ' + (avgLR||'—') + '</div><div class="lbl">ПЗ / ЛР</div></div>';
            if (dopText) h += '<div class="stat-card"><div class="val" style="font-size:1.2em;color:#6366f1;">' + dopText + '</div><div class="lbl">Допуск</div></div>';
            h += '</div>';

            var pct = total ? Math.round(done/total*100) : 0;
            var fc = pct>=80?'fill-green':pct>=50?'fill-yellow':'fill-red';
            h += '<div style="margin:8px 0;font-size:.8em;">Прогресс: <b>' + pct + '%</b> (' + done + ' из ' + total + ' сдано, ' + debts + ' долгов)</div>';
            h += '<div class="progress-bar"><div class="progress-fill ' + fc + '" style="width:' + pct + '%"></div></div>';

            h += '<div class="section-title">Практические занятия (ср. балл: ' + (avgPZ||'—') + ')</div><div class="task-grid">';
            pzKeys.forEach(function(id){ h += renderCard(id, pzTasks[id]); });
            h += '</div>';

            h += '<div class="section-title">Лабораторные работы (ср. балл: ' + (avgLR||'—') + ')</div><div class="task-grid">';
            lrKeys.forEach(function(id){ h += renderCard(id, lrTasks[id]); });
            h += '</div>';

            h += '<button class="btn btn-secondary btn-sm mt-2" onclick="loadData(true)">Обновить</button>';
            document.getElementById('mainContent').innerHTML = h;
        }

        function renderCard(id, task) {
            var status = task ? (task.status||'') : '';
            var grade = task ? (task.grade||'') : '';
            var gVal = String(grade || '').toLowerCase();
            var sVal = String(status || '').toLowerCase();

            var isAbsent = gVal === 'н' || gVal === 'н/б' || sVal === 'н' || sVal === 'н/б';
            var hasGrade = grade && !isNaN(parseFloat(grade)) && parseFloat(grade) > 0;
            var isDone = hasGrade && sVal !== '2' && !isAbsent;
            var display, cls, badge;
            if (isAbsent) {
                display = hasGrade ? grade : 'н/б';
                cls = hasGrade ? ('grade-' + (parseFloat(grade)>=5?'5':parseFloat(grade)>=4?'4':parseFloat(grade)>=3?'3':'2')) : 'grade-empty';
                badge = '<span class="status-badge" style="background:#fef9c3;color:#854d0e;">пропуск</span>';
            } else if (isDone) {
                display = grade;
                cls = 'grade-' + (parseFloat(grade)>=5?'5':parseFloat(grade)>=4?'4':parseFloat(grade)>=3?'3':'2');
                badge = '<span class="status-badge badge-done">✔</span>';
            } else {
                display = 'долг';
                cls = 'grade-2';
                badge = '<span class="status-badge badge-fail">✘</span>';
            }
            return '<div class="task-card"><h4>' + id + '</h4><div class="grade ' + cls + '">' + display + '</div>' + badge + '</div>';
        }

        function showError(msg) {
            document.getElementById('mainContent').innerHTML = '<h2>Мои оценки</h2><p class="text-muted">' + user.name + ' | Группа ' + user.group + '</p><div style="text-align:center;padding:40px;color:#dc2626;"><p>' + msg + '</p><button class="btn btn-primary mt-2" onclick="loadData()">Попробовать снова</button></div>';
        }

        function doLogout() {
            sessionStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
