<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель преподавателя — Информатика СПО</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
        }
        .stat-card .stat-value { font-size: 2em; font-weight: 700; color: var(--primary); }
        .stat-card .stat-label { color: var(--text-secondary); font-size: 0.9em; margin-top: 4px; }
        .group-filter { margin-bottom: 20px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .group-filter select { padding: 8px 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); }
        .table-container { overflow-x: auto; }
        .btn-sm { padding: 6px 14px; font-size: 0.85em; }
        .green { color: #059669; font-weight: 600; }
        .yellow { color: #d97706; }
        .red { color: #dc2626; }
        .gray { color: #94a3b8; }
    </style>
</head>
<body>
    <header class="header">
        <h1>👨‍🏫 Панель преподавателя — Информатика СПО</h1>
        <div class="user-block">
            <span id="adminName"></span>
            <button class="btn btn-outline" onclick="logout()">🚪 Выйти</button>
        </div>
    </header>

    <div class="container" style="flex-direction:column;">
        <div class="main-content" style="width:100%;">
            <h2>📊 Результаты студентов</h2>
            
            <!-- Статистика -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="stat-value" id="statTotal">0</div>
                    <div class="stat-label">Всего студентов</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statActive">0</div>
                    <div class="stat-label">Приступили</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statAvg">0</div>
                    <div class="stat-label">Средний балл</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statDone">0</div>
                    <div class="stat-label">Всё сдали</div>
                </div>
            </div>
            
            <!-- Фильтр по группам -->
            <div class="group-filter">
                <label><b>Группа:</b></label>
                <select id="groupFilter" onchange="renderAll()">
                    <option value="all">Все группы</option>
                    <option value="101">101</option>
                    <option value="102">102</option>
                    <option value="103">103</option>
                    <option value="104">104</option>
                    <option value="105">105</option>
                    <option value="106">106</option>
                    <option value="107">107</option>
                </select>
                
                <button class="btn btn-primary" onclick="exportToCSV()">
                    📥 Экспорт в Excel
                </button>
                <button class="btn btn-secondary" onclick="exportFullReport()">
                    📄 Полный отчёт
                </button>
                <button class="btn btn-danger" onclick="resetAllData()" style="margin-left:8px;">
                    🗑️ Сбросить все данные
                </button>
            </div>
            
            <!-- Таблица результатов -->
            <div class="table-container">
                <table id="resultsTable">
                    <thead>
                        <tr>
                            <th>№</th>
                            <th>Группа</th>
                            <th>ФИО</th>
                            <th>Логин</th>
                            <th>ПЗ1</th>
                            <th>ПЗ2</th>
                            <th>ПЗ3</th>
                            <th>ПЗ5</th>
                            <th>ПЗ6</th>
                            <th>ПЗ7</th>
                            <th>ПЗ8</th>
                            <th>Всего</th>
                            <th>Выполнено</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="13" style="text-align:center;padding:40px;color:#94a3b8;">
                            Нет данных о студентах. Возможно, ни один студент ещё не входил в систему.
                        </td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Загружаем список студентов и систему авторизации -->
    <script src="data/students.js"></script>
    <script src="js/auth.js"></script>
    
    <script>
        // Проверка авторизации
        const user = checkAuth();
        if (!user || !user.isAdmin) {
            alert('Доступ запрещён!');
            window.location.href = 'index.html';
        }
        
        document.getElementById('adminName').textContent = user.name;
        
        // Задания
        const TASKS = {
            pz1: { name: 'ПЗ1', max: 16 },
            pz2: { name: 'ПЗ2', max: 15 },
            pz3: { name: 'ПЗ3', max: 24 },
            pz5: { name: 'ПЗ5', max: 5 },
            pz6: { name: 'ПЗ6', max: 5 },
            pz7: { name: 'ПЗ7', max: 16 },
            pz8: { name: 'ПЗ8', max: 20 }
        };
        
        const TOTAL_TASKS = Object.keys(TASKS).length;
        
        // Получение списка студентов с результатами
        function getStudentsWithResults() {
            const students = [];
            
            // Проходим по ВСЕМ студентам из students.js
            for (let [login, userData] of Object.entries(STUDENTS)) {
                if (userData.isAdmin) continue; // пропускаем админа
                
                const results = resultsData[login]?.tasks || {};
                
                // Считаем выполненные задания (те, где баллы > 0)
                let totalDone = 0;
                let totalScore = 0;
                
                Object.entries(TASKS).forEach(([tid, task]) => {
                    if (results[tid] && results[tid].score !== null && results[tid].score !== undefined) {
                        totalDone++;
                        totalScore += results[tid].score;
                    }
                });
                
                students.push({
                    login: login,
                    name: userData.name,
                    group: userData.group,
                    results: results,
                    totalDone: totalDone,
                    totalScore: totalScore,
                    lastLogin: resultsData[login]?.lastLogin || null
                });
            }
            
            // Сортируем: сначала по группе, потом по фамилии
            students.sort((a, b) => {
                if (a.group !== b.group) return a.group.localeCompare(b.group);
                return a.name.localeCompare(b.name);
            });
            
            return students;
        }
        
        // Фильтр по группе
        function filterByGroup(students) {
            const group = document.getElementById('groupFilter').value;
            if (group === 'all') return students;
            return students.filter(s => s.group === group);
        }
        
        // Обновление статистики
        function updateStats(students) {
            const total = students.length;
            const active = students.filter(s => s.totalDone > 0).length;
            const avgScore = total > 0 ? Math.round(students.reduce((sum, s) => sum + s.totalScore, 0) / total) : 0;
            const completed = students.filter(s => s.totalDone === TOTAL_TASKS).length;
            
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statActive').textContent = active;
            document.getElementById('statAvg').textContent = avgScore;
            document.getElementById('statDone').textContent = completed;
        }
        
        // Рендеринг таблицы
        function renderTable(students) {
            if (students.length === 0) {
                document.getElementById('tableBody').innerHTML = `
                    <tr><td colspan="13" style="text-align:center;padding:40px;color:#94a3b8;">
                        Нет студентов в выбранной группе.
                    </td></tr>`;
                return;
            }
            
            let html = '';
            students.forEach((student, i) => {
                html += `<tr>
                    <td>${i + 1}</td>
                    <td><b>${student.group}</b></td>
                    <td style="text-align:left;">${student.name}</td>
                    <td><code>${student.login}</code></td>`;
                
                Object.keys(TASKS).forEach(tid => {
                    const result = student.results[tid];
                    if (result && result.score !== null && result.score !== undefined) {
                        const pct = result.percent || Math.round(result.score / TASKS[tid].max * 100);
                        const cls = pct >= 80 ? 'green' : pct >= 50 ? 'yellow' : 'red';
                        html += `<td class="${cls}">${result.score}/${TASKS[tid].max}</td>`;
                    } else {
                        html += `<td class="gray">—</td>`;
                    }
                });
                
                html += `<td style="font-weight:600;">${student.totalScore}</td>
                    <td>${student.totalDone}/${TOTAL_TASKS}</td>
                </tr>`;
            });
            
            document.getElementById('tableBody').innerHTML = html;
        }
        
        // Главная функция рендеринга
        function renderAll() {
            const allStudents = getStudentsWithResults();
            const filtered = filterByGroup(allStudents);
            updateStats(filtered);
            renderTable(filtered);
        }
        
        // Экспорт в CSV (Excel)
        function exportToCSV() {
            const students = filterByGroup(getStudentsWithResults());
            
            let csv = '\uFEFF№;Группа;ФИО;Логин;';
            Object.values(TASKS).forEach(t => csv += t.name + ';');
            csv += 'Всего баллов;Выполнено\n';
            
            students.forEach((s, i) => {
                csv += `${i+1};${s.group};${s.name};${s.login};`;
                Object.keys(TASKS).forEach(tid => {
                    const r = s.results[tid];
                    csv += (r && r.score !== null ? r.score : '') + ';';
                });
                csv += `${s.totalScore};${s.totalDone}\n`;
            });
            
            downloadFile(csv, 'results.csv', 'text/csv;charset=utf-8;');
        }
        
        // Экспорт полного отчёта
        function exportFullReport() {
            const students = filterByGroup(getStudentsWithResults());
            
            let report = 'ОТЧЁТ ПО УСПЕВАЕМОСТИ\n';
            report += 'Дата: ' + new Date().toLocaleDateString() + '\n';
            report += '='.repeat(50) + '\n\n';
            
            const groups = [...new Set(students.map(s => s.group))].sort();
            
            if (groups.length === 0) {
                report += 'Нет данных для отображения.\n';
            }
            
            groups.forEach(group => {
                report += `ГРУППА ${group}\n${'-'.repeat(30)}\n`;
                const groupStudents = students.filter(s => s.group === group);
                
                groupStudents.forEach((s, i) => {
                    report += `${i+1}. ${s.name} (${s.login})\n`;
                    report += `   Выполнено: ${s.totalDone}/${TOTAL_TASKS}\n`;
                    report += `   Всего баллов: ${s.totalScore}\n`;
                    Object.entries(TASKS).forEach(([tid, task]) => {
                        const r = s.results[tid];
                        const status = (r && r.score !== null) ? `${r.score}/${task.max}` : 'не выполнено';
                        report += `   ${task.name}: ${status}\n`;
                    });
                    report += '\n';
                });
                report += '\n';
            });
            
            downloadFile(report, 'full_report.txt', 'text/plain;charset=utf-8;');
        }
        
        // Сброс всех данных
        function resetAllData() {
            if (!confirm('ВНИМАНИЕ! Будут удалены ВСЕ результаты студентов. Продолжить?')) return;
            if (!confirm('Точно? Это действие нельзя отменить!')) return;
            
            localStorage.removeItem('itResults');
            resultsData = {};
            alert('Все данные сброшены.');
            renderAll();
        }
        
        // Скачивание файла
        function downloadFile(content, filename, type) {
            const blob = new Blob([content], { type });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        }
        
        // Загрузка при открытии
        renderAll();
    </script>
</body>
</html>
